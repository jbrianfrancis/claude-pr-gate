# Copy to .github/workflows/pr-gate.yml in the repo you want gated.
name: pr-gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write   # summary + inline comments
  statuses: write        # PASS/FAIL commit status
jobs:
  gate:
    # Forked PRs don't receive secrets; skip them instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # No checkout needed: the action reads the diff and the base commit's .pr-gate.yml via the API.
      - uses: jbrianfrancis/claude-pr-gate@v1.3
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # model: claude-sonnet-5-5
